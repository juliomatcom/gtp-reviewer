name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate action.yml
        run: |
          python3 - <<'PY'
          import yaml
          a = yaml.safe_load(open("action.yml"))
          missing = [k for k in ("name", "description", "runs") if k not in a]
          assert not missing, f"action.yml missing keys: {missing}"
          PY

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint JS and JSON
        run: npx eslint .

      - name: Test
        run: npm test
