name: Release

on:
  push:
    branches: [main]
    # A docs-only change ships no new behavior, so it cuts no release.
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"

          if [ "$last" = "v0.0.0" ]; then
            range=HEAD
          else
            range="$last..HEAD"
          fi
          log=$(git log "$range" --format='%s%n%b')

          # Bump from conventional commits: breaking > feat > anything else
          if echo "$log" | grep -qE '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE'; then
            major=$((major + 1)); minor=0; patch=0
          elif echo "$log" | grep -qE '^feat(\([^)]*\))?:'; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi

          echo "tag=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "major=v$major" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          # Floating major tag so users can pin to @v1
          git tag -f "$MAJOR"
          git push origin "$TAG"
          git push -f origin "$MAJOR"

          gh release create "$TAG" --title "$TAG" --generate-notes
