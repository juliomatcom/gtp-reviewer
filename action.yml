name: Codex Review with Merge Confidence
description: Review a pull request with Codex and post inline findings and a merge confidence, approving on high confidence.

branding:
  icon: check-circle
  color: green

inputs:
  openai-api-key:
    description: OpenAI API key.
    required: true
  model:
    description: Codex model.
    default: gpt-6-luna
  effort:
    description: Reasoning effort.
    default: medium
  permission-profile:
    description: Codex sandbox permission profile.
    default: ':workspace'
  instructions-file:
    description: Repo-relative path to project review instructions, read from the base branch so a PR cannot rewrite its own review. Optional.
    default: ''
  github-token:
    description: Token that reads the PR's earlier review threads and posts the review; needs pull-requests write.
    default: ${{ github.token }}

outputs:
  review:
    description: Review JSON matching review-schema.json; empty when Codex returned nothing.
    value: ${{ steps.codex.outputs.final-message }}

runs:
  using: composite
  steps:
    # An unset or unreachable secret expands to an empty string, and codex-action then only
    # times out reading the proxy's server info file instead of naming the cause.
    - name: Check OpenAI API key
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "::error title=openai-api-key is empty::Check that the secret passed as openai-api-key exists and that this workflow can read it."
          exit 1
        fi

    - uses: actions/checkout@v5
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
        persist-credentials: false

    # Checkout drops its credentials so Codex never sees them, and a private repo refuses an
    # anonymous fetch: authenticate this one command without writing the token to git config.
    - name: Fetch base and head refs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
          fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

    - name: Build prompt
      uses: actions/github-script@v7
      env:
        INSTRUCTIONS_FILE: ${{ inputs.instructions-file }}
        PROMPT_FILE: ${{ runner.temp }}/codex-prompt.md
        BUILD_PROMPT: ${{ github.action_path }}/src/build-prompt.js
      with:
        github-token: ${{ inputs.github-token }}
        script: await (await import(process.env.BUILD_PROMPT)).default({ github, context, core })

    # A fresh Codex home per run, so its session log holds only this review's token usage.
    - name: Prepare Codex home
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/codex-home"

    - name: Run Codex
      id: codex
      uses: openai/codex-action@v1
      with:
        openai-api-key: ${{ inputs.openai-api-key }}
        model: ${{ inputs.model }}
        effort: ${{ inputs.effort }}
        permission-profile: ${{ inputs.permission-profile }}
        working-directory: ${{ github.workspace }}
        prompt-file: ${{ runner.temp }}/codex-prompt.md
        output-schema-file: ${{ github.action_path }}/src/review-schema.json
        codex-home: ${{ runner.temp }}/codex-home

    - name: Post review
      if: steps.codex.outputs.final-message != ''
      uses: actions/github-script@v7
      env:
        REVIEW: ${{ steps.codex.outputs.final-message }}
        CODEX_HOME: ${{ runner.temp }}/codex-home
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        POST_REVIEW: ${{ github.action_path }}/src/post-review.js
      with:
        github-token: ${{ inputs.github-token }}
        script: await (await import(process.env.POST_REVIEW)).default({ github, context, core })
