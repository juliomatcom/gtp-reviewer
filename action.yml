name: Codex Review with Merge Confidence
description: Review a pull request with Codex and post inline findings and a merge confidence, approving on high confidence.

branding:
  icon: check-circle
  color: green

inputs:
  openai-api-key:
    description: OpenAI API key.
    required: true
  model:
    description: Codex model.
    default: gpt-6-luna
  effort:
    description: Reasoning effort.
    default: medium
  permission-profile:
    description: Codex sandbox permission profile.
    default: ':workspace'
  codex-version:
    description: '@openai/codex npm version to install.'
    default: latest
  instructions-file:
    description: Repo-relative path to project review instructions, read from the base branch so a PR cannot rewrite its own review. Optional.
    default: ''
  github-token:
    description: Token that reads the PR's earlier review threads and posts the review; needs pull-requests write.
    default: ${{ github.token }}

outputs:
  review:
    description: Review JSON matching review-schema.json; empty when Codex returned nothing.
    value: ${{ steps.codex-cli.outputs.final-message }}

runs:
  using: composite
  steps:
    # An unset or unreachable secret expands to an empty string, and the proxy then only
    # times out writing its server info file instead of naming the cause.
    - name: Check OpenAI API key
      shell: bash
      env:
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
      run: |
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "::error title=openai-api-key is empty::Check that the secret passed as openai-api-key exists and that this workflow can read it."
          exit 1
        fi

    - uses: actions/checkout@v5
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
        persist-credentials: false

    # Checkout drops its credentials so Codex never sees them, and a private repo refuses an
    # anonymous fetch: authenticate this one command without writing the token to git config.
    - name: Fetch base and head refs
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
          fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

    - name: Build prompt
      uses: actions/github-script@v9
      env:
        INSTRUCTIONS_FILE: ${{ inputs.instructions-file }}
        PROMPT_FILE: ${{ runner.temp }}/codex-prompt.md
        BUILD_PROMPT: ${{ github.action_path }}/src/build-prompt.js
      with:
        github-token: ${{ inputs.github-token }}
        script: await (await import(process.env.BUILD_PROMPT)).default({ github, context, core })

    # A fresh Codex home per run, so its session log holds only this review's token usage.
    - name: Prepare Codex home
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/codex-home"

    # A user-level prefix, so no sudo is needed; its own step so install scripts never see the key.
    - name: Install Codex CLI
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: npm install --global --prefix "$RUNNER_TEMP/codex-cli" "@openai/codex@$CODEX_VERSION" "@openai/codex-responses-api-proxy@$CODEX_VERSION"

    # The key goes to a local proxy over stdin and nowhere else; Codex gets only the proxy's port. No sudo is
    # needed anywhere, so the runner user can be an ordinary one.
    - name: Start Responses API proxy
      id: codex-proxy
      shell: bash
      env:
        PROXY_API_KEY: ${{ inputs.openai-api-key }}
        CODEX_HOME: ${{ runner.temp }}/codex-home
        SERVER_INFO_FILE: ${{ runner.temp }}/codex-proxy.json
      run: |
        set -euo pipefail
        rm -f "$SERVER_INFO_FILE"
        # The subshell replaces itself with the proxy, so no copy of the key stays in a shell.
        (
          exec env -u PROXY_API_KEY -u NODE_OPTIONS NODE_OPTIONS=--disable-sigusr1 \
            "$RUNNER_TEMP/codex-cli/bin/codex-responses-api-proxy" --http-shutdown --server-info "$SERVER_INFO_FILE" <<< "$PROXY_API_KEY"
        ) &
        # The file can be seen half written: keep trying until it parses.
        port=
        for _ in {1..20}; do
          port=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).port" "$SERVER_INFO_FILE" 2>/dev/null) && [ -n "$port" ] && break
          port=
          sleep 1
        done
        [ -n "$port" ] || { echo "::error title=Responses API proxy did not start::No port in $SERVER_INFO_FILE"; exit 1; }
        echo "port=$port" >> "$GITHUB_OUTPUT"
        cat > "$CODEX_HOME/config.toml" <<TOML
        model_provider = "review-proxy"

        [model_providers.review-proxy]
        name = "Responses API proxy"
        base_url = "http://127.0.0.1:$port/v1"
        wire_api = "responses"
        TOML

    # A clean environment, so Codex sees none of the runner's tokens or secrets.
    - name: Run Codex CLI
      id: codex-cli
      shell: bash
      env:
        CODEX_HOME: ${{ runner.temp }}/codex-home
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        PERMISSION_PROFILE: ${{ inputs.permission-profile }}
        PROMPT_FILE: ${{ runner.temp }}/codex-prompt.md
        SCHEMA_FILE: ${{ github.action_path }}/src/review-schema.json
        OUTPUT_FILE: ${{ runner.temp }}/codex-review.json
      run: |
        set -euo pipefail
        env -i PATH="$PATH" HOME="$HOME" LANG="${LANG:-C.UTF-8}" CODEX_HOME="$CODEX_HOME" \
          "$RUNNER_TEMP/codex-cli/bin/codex" exec \
          --skip-git-repo-check \
          --cd "$GITHUB_WORKSPACE" \
          --output-last-message "$OUTPUT_FILE" \
          --output-schema "$SCHEMA_FILE" \
          --model "$MODEL" \
          --config "model_reasoning_effort=\"$EFFORT\"" \
          --config "default_permissions=\"$PERMISSION_PROFILE\"" \
          < "$PROMPT_FILE"
        delimiter="EOF_$(openssl rand -hex 16)"
        {
          echo "final-message<<$delimiter"
          cat "$OUTPUT_FILE"
          echo
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"

    - name: Stop Responses API proxy
      if: always() && steps.codex-proxy.outputs.port != ''
      shell: bash
      env:
        PORT: ${{ steps.codex-proxy.outputs.port }}
      run: curl --silent --max-time 10 "http://127.0.0.1:$PORT/shutdown" || true

    - name: Post review
      if: steps.codex-cli.outputs.final-message != ''
      uses: actions/github-script@v9
      env:
        REVIEW: ${{ steps.codex-cli.outputs.final-message }}
        CODEX_HOME: ${{ runner.temp }}/codex-home
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        POST_REVIEW: ${{ github.action_path }}/src/post-review.js
      with:
        github-token: ${{ inputs.github-token }}
        script: await (await import(process.env.POST_REVIEW)).default({ github, context, core })
